# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.

RELOAD_HTTP="
    push_stream_shared_memory_size 8m;"

RELOAD_SERVER="
        location /pub {
            push_stream_publisher admin;
            push_stream_channels_path \$arg_id;
        }

        location /probe {
            push_stream_channels_statistics;
            push_stream_channels_path \$arg_id;
        }"

# A channel is created through the publisher and then read back from the
# statistics endpoint.  Both live in the module's shared memory, so this
# asks whether that memory survived the reload -- which is the thing a
# reload can break and nothing else here would notice.
RELOAD_EXPECT='reload-probe-channel'

reload_probe() {
	curl -s --max-time 5 -X POST -d 'hello' \
		"http://127.0.0.1:$PORT/pub?id=reload-probe-channel" > /dev/null
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe?id=reload-probe-channel" |
		sed -n 's/.*"channel": *"\(reload-probe-channel\)".*/\1/p' | head -1
}
